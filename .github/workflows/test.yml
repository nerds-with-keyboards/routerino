name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Pack release artifact
        run: |
          mkdir package-artifact
          npm pack --ignore-scripts --pack-destination package-artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: routerino-package
          path: package-artifact/*.tgz

  react-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: [18, 19]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react-version }}
        run: npm install --no-save react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}

      - name: Run runtime and Forge unit tests
        run: npm run test:run -- --exclude test/forge-output.test.js --exclude test/forge-no-trailing.test.js

  node-compatibility:
    name: Node ${{ matrix.node-version }} / Vite ${{ matrix.vite-version }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 18
            vite-version: 4
            react-plugin-version: 4
          - node-version: 20
            vite-version: 5
            react-plugin-version: 4
          - node-version: 20
            vite-version: 6
            react-plugin-version: 4
          - node-version: 20
            vite-version: 7
            react-plugin-version: 5
          - node-version: 22
            vite-version: 7
            react-plugin-version: 5
          - node-version: 24
            vite-version: 8
            react-plugin-version: 6

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: routerino-package
          path: package-artifact

      - name: Install packed package with supported peers
        working-directory: test-apps/package-consumer
        run: >-
          npm install --no-save --no-package-lock
          ../../package-artifact/routerino-*.tgz
          react@18 react-dom@18 prop-types@15
          vite@${{ matrix.vite-version }}
          @vitejs/plugin-react@${{ matrix.react-plugin-version }}

      - name: Build packed-package consumer
        working-directory: test-apps/package-consumer
        run: npm run build

      - name: Verify SSG output
        working-directory: test-apps/package-consumer
        run: |
          test -s dist/index.html
          test -s dist/about.html
          test -s dist/404.html
          test -s dist/sitemap.xml
          grep -q "Packed package home" dist/index.html
          grep -q "Packed package about" dist/about.html
